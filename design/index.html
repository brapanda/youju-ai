<header class="topbar"><button class="brand" data-page="home" aria-label="Youju 首页"><span class="brand-icon"><svg><use href="#i-home"/></svg></span><span>Youju<span class="brand-cn">悠居</span></span></button><div class="header-right"><span class="prototype-pill">UI 设计预览</span><button class="location" id="locationBtn"><svg><use href="#i-pin"/></svg> Toronto <span>⌄</span></button><button class="icon-button theme-toggle" aria-label="切换深浅色主题"><svg><use href="#i-moon"/></svg></button></div></header>
